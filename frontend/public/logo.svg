<svg width="120" height="80" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Red circle (left) -->
  <circle cx="35" cy="40" r="28" fill="none" stroke="#E31937" stroke-width="8"/>

  <!-- Blue circle (right) -->
  <circle cx="85" cy="40" r="28" fill="none" stroke="#6D9EAF" stroke-width="8"/>

  <!-- Connecting dots -->
  <circle cx="60" cy="25" r="5" fill="#5C3A3A"/>
  <circle cx="60" cy="55" r="5" fill="#5C3A3A"/>

  <!-- Inner pattern bars -->
  <g transform="translate(60, 40)">
    <!-- Red bars (left) -->
    <rect x="-25" y="-15" width="8" height="30" rx="4" fill="#E31937"/>
    <rect x="-15" y="-15" width="8" height="30" rx="4" fill="#C41230"/>
    <rect x="-5" y="-15" width="8" height="30" rx="4" fill="#5C3A3A"/>

    <!-- Blue bars (right) -->
    <rect x="5" y="-15" width="8" height="30" rx="4" fill="#6D9EAF"/>
    <rect x="15" y="-15" width="8" height="30" rx="4" fill="#9BC4D3"/>
  </g>
</svg>
