name: Release

# Builds the Windows desktop package and publishes it to a GitHub Release
# whenever you push a tag like v1.0.0.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Bundle the FastAPI backend so users don't need Python. We use --onedir
      # (not --onefile): onefile extracts to %TEMP% at every launch, which is
      # slow with AV and often BLOCKED by corporate execution policies. onedir
      # runs directly from its folder -> faster and policy-friendly.
      - name: Build backend executable (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
          cd backend
          pyinstaller --onedir --noconfirm --name pmcc-backend `
            --collect-all pandas `
            --collect-all numpy `
            --collect-all sqlalchemy `
            --collect-all openpyxl `
            --collect-submodules aiosqlite `
            --collect-submodules uvicorn `
            --collect-submodules anyio `
            run_backend.py
          if (Test-Path pmcc-backend) { Remove-Item pmcc-backend -Recurse -Force }
          Move-Item dist/pmcc-backend pmcc-backend

      - name: Install Node dependencies
        run: npm install

      # Code signing (optional): only enable it when the secret actually exists.
      # electron-builder treats a *defined-but-empty* CSC_LINK as "sign now" and
      # fails, so we must leave the vars UNSET when no certificate is configured.
      - name: Configure code signing (optional)
        shell: bash
        env:
          SECRET_CSC: ${{ secrets.WINDOWS_CSC_LINK }}
          SECRET_PWD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_CSC" ]; then
            echo "CSC_LINK=$SECRET_CSC" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$SECRET_PWD" >> "$GITHUB_ENV"
            echo "Code signing: ENABLED"
          else
            echo "Code signing: disabled (no WINDOWS_CSC_LINK secret) — building unsigned"
          fi

      # Builds the React frontend + Electron installer/portable and uploads
      # them to the GitHub Release for this tag. Signs automatically if the
      # previous step populated CSC_LINK. See SIGNING.md.
      - name: Build & publish desktop app
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
